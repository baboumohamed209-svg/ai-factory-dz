<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Sales Agent | AI Factory DZ</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
}


.container{
max-width:700px;
margin:40px auto;
padding:20px;
}


h1{
text-align:center;
color:#00d9ff;
}


.box{
background:#111827;
padding:25px;
border-radius:20px;
margin-bottom:20px;
}


input,textarea{

width:100%;
padding:15px;
margin:10px 0;
border-radius:10px;
border:none;
font-size:16px;

}


button{

background:#00d9ff;
border:none;
padding:15px 30px;
border-radius:30px;
font-size:18px;
cursor:pointer;

}


#answer{

background:#020617;
padding:20px;
border-radius:15px;
margin-top:20px;
line-height:1.8;

}


</style>

</head>


<body>


<div class="container">


<h1>
🤖 AI Sales Agent
</h1>


<div class="box">

<h2>
معلومات الشركة
</h2>


<input id="company" placeholder="اسم الشركة">

<input id="product" placeholder="المنتج أو الخدمة">

<input id="price" placeholder="السعر">


</div>



<div class="box">

<h2>
رسالة الزبون
</h2>


<textarea id="message" rows="4" placeholder="اكتب رسالة الزبون هنا"></textarea>


<button onclick="generate()">
توليد الرد 🤖
</button>


<div id="answer">
الرد سيظهر هنا...
</div>


</div>


</div>



<script>


function generate(){


let company =
document.getElementById("company").value;


let product =
document.getElementById("product").value;


let price =
document.getElementById("price").value;


let message =
document.getElementById("message").value;



let response =
`
مرحبا بك في ${company} 👋

بالنسبة لسؤالك:
"${message}"

نعم، لدينا ${product} متوفر.

السعر هو:
${price}

يمكنك الطلب الآن، وسنساعدك بكل سرور.

شكراً لثقتك بنا 🤖
`;



document.getElementById("answer").innerHTML=response;


}


</script>


</body>

</html>
